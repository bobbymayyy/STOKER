[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoker-iso-builder"
version = "0.1.4"
description = "Declarative Debian ISO compiler for the STOKER appliance"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
stoker-build = "stoker_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
