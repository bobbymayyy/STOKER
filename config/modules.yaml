modules:
  ansible_controller:
    enabled: true
    packages:
      - ansible-core
      - ansible-lint
      - git
      - openssh-client
      - rsync
      - zstd
      - python3
      - python3-jinja2
      - python3-venv
      - python3-yaml
    post_install_script: ansible-controller.sh
    configuration:
      inventory_path: /opt/stoker/inventory
      project_path: /opt/stoker/projects
      versions_path: /opt/stoker/.versions/projects
      staging_path: /opt/stoker/.staging/projects
      roles_path: /opt/stoker/roles
      collections_path: /opt/stoker/collections
      artifacts_path: /opt/stoker/artifacts
      logs_path: /opt/stoker/logs/ansible
      secrets_path: /etc/stoker/secrets

  containers:
    enabled: true
    packages:
      - docker.io
      - docker-cli
      - docker-compose
    post_install_script: containers.sh
    configuration:
      compose_path: /opt/stoker/compose
      image_cache_path: /opt/stoker/images

  routing:
    enabled: true
    packages:
      - nftables
      - python3
      - python3-yaml
    post_install_script: network.sh
    configuration:
      # auto selects the interface currently configured for DHCP/default-route use.
      upstream_interface: auto
      enable_ipv4_forwarding: true
      # Runtime override: sudo stoker-nat enable|disable|reset|status
      enable_nat: false

  dhcp:
    enabled: true
    packages:
      - kea-dhcp4-server
    post_install_script: network.sh
    configuration:
      interface: auto
      subnet: 192.168.88.0/24
      pool_start: 192.168.88.100
      pool_end: 192.168.88.200
      gateway: 192.168.88.1
      dns_servers: [192.168.88.1]
      domain_name: stoker.internal
      renew_timer: 900
      rebind_timer: 1800
      valid_lifetime: 3600
      max_valid_lifetime: 7200

  dns:
    enabled: true
    packages:
      - bind9
      - bind9-utils
    post_install_script: network.sh
    configuration:
      recursion: true
      forwarders: [1.1.1.1, 9.9.9.9]
      forward_policy: only
