### STOKER Debian 13 (Trixie) unattended appliance install
### WARNING: This configuration erases the selected first non-USB fixed disk.

### Installer behavior
d-i auto-install/enable boolean true
d-i debconf/priority select critical
d-i finish-install/reboot_in_progress note

### Locale and console
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string stoker
d-i netcfg/get_domain string stoker.internal
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/get_ipaddress string
d-i netcfg/get_netmask string
d-i netcfg/get_gateway string
d-i netcfg/get_nameservers string
d-i netcfg/confirm_static boolean true
d-i netcfg/enable boolean true
d-i netcfg/use_autoconfig boolean true
d-i netcfg/wireless_wep string

### Time
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

### Accounts
# Generate the hash with: printf '%s' 'PASSWORD' | mkpasswd -s -m yescrypt
# Replace the placeholder before building the ISO.
# Root remains locked; stoker is the only interactive administrative account.
d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean true
d-i passwd/user-fullname string STOKER Administrator
d-i passwd/username string stoker
d-i passwd/user-password-crypted password CHANGE_ME_STOKER_HASH
d-i passwd/user-default-groups string audio cdrom video sudo plugdev users netdev

### Package source during base installation
# The normal Debian netinst payload installs the base system. The STOKER local
# repository is copied and activated by late_command for the appliance packages.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/disable-cdrom-entries boolean false
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect

tasksel tasksel/first multiselect standard
# Keep this list small; the larger package set comes from /stoker/repo.
d-i pkgsel/include string openssh-server sudo ca-certificates
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Disk selection and erasure
# false wipes only the selected installation disk. true reproduces the Oracle
# Kickstart behavior and wipes every attached non-removable, non-USB disk.
d-i partman/early_command string \
    cp /cdrom/stoker/scripts/select-install-disk.sh /tmp/select-install-disk.sh; \
    chmod 0755 /tmp/select-install-disk.sh; \
    /tmp/select-install-disk.sh \
        --wipe-all-fixed-disks=false \
        --require-uefi=true

### GPT + encrypted LVM
# Disk selection remains delegated to select-install-disk.sh above. That script
# sets partman-auto/disk and grub-installer/bootdev after excluding USB and
# removable media, and optionally handles stoker/wipe_all_fixed_disks.
#
# Boot this installer in UEFI mode to receive an EFI System Partition.
# Debian's atomic recipe creates /boot plus one encrypted-LVM root filesystem
# and swap. It does not split /home, /var, /tmp, or logs into separate volumes,
# so / receives the bulk of even a small (approximately 8 GB) virtual disk.
#
# Replace this passphrase before building. An ISO-embedded preseed exposes it to
# anyone able to read the ISO; use first-boot rekeying for higher assurance.
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string stoker-vg
d-i partman-auto-lvm/purge_lvm_from_device boolean true

d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true

d-i partman-crypto/passphrase password CHANGE_ME_LUKS_PASSPHRASE
d-i partman-crypto/passphrase-again password CHANGE_ME_LUKS_PASSPHRASE
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true
d-i partman-crypto/erase_disks boolean false

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Final provisioning
# install-offline-packages.sh is still responsible for activating the embedded
# repository and installing the appliance package set. No additional login
# account is created here; the installer-created stoker account is reused.
d-i preseed/late_command string \
    cp /cdrom/stoker/scripts/install-offline-packages.sh /tmp/install-offline-packages.sh; \
    chmod 0755 /tmp/install-offline-packages.sh; \
    /tmp/install-offline-packages.sh; \
    mkdir -p /target/opt/stoker/compose /target/opt/stoker/inventory /target/opt/stoker/projects /target/opt/stoker/.versions/projects /target/opt/stoker/.staging/projects /target/opt/stoker/roles /target/opt/stoker/collections /target/opt/stoker/artifacts /target/opt/stoker/images /target/opt/stoker/backups /target/opt/stoker/config /target/opt/stoker/logs; \
    if in-target getent group docker >/dev/null 2>&1; then \
        in-target usermod --append --groups docker stoker; \
    fi; \
    chown -R root:stoker /target/opt/stoker; \
    chmod 0750 /target/opt/stoker
